# Dual-granularity pretrained-reranker ablation (Kaggle T4x2).
# Supply the portable dual artifact location at search time with
# `--dual-chunks-dir`; this config intentionally contains no machine path.
bm25:
  method: lucene
  k1: 1.2
  b: 0.75
  top_k_chunks: 50
  mmap: true

dense:
  model_name: AITeamVN/Vietnamese_Embedding_v2
  revision: 18b44161e041bf1d3a333ab5144b5b7b93f914d2
  top_k_chunks: 100
  batch_size: 16
  max_length: 2048
  device: auto
  dtype: float16
  normalize_embeddings: true
  multi_gpu: true
  multi_process_chunk_size: 256
  multi_gpu_stall_timeout_seconds: 1800
  index_type: flat
  hnsw_m: 32
  hnsw_ef_construction: 200
  hnsw_ef_search: 128

hyde:
  enabled: false
  model_name: AITeamVN/Vi-Qwen2-1.5B-RAG
  revision: c8272ce4ad08da4cc27b4bda59faabc66caedf07
  top_k_chunks: 200
  max_new_tokens: 192
  do_sample: false
  temperature: 0.7
  top_p: 0.8
  device: auto
  dtype: auto
  trust_remote_code: false

# Retained for legacy mode compatibility; long-context mode unions short chunks
# directly and uses rrf_k/channel_weights to rank mapped long candidates.
fusion:
  rrf_k: 60
  candidate_documents: 30
  evidence_chunks_per_document: 3
  channel_weights:
    bm25: 1.0
    dense: 1.0
    hyde: 0.5

reranker:
  enabled: true
  model_name: AITeamVN/Vietnamese_Reranker
  revision: f536976248403314225d7fdfdbc87f0e9516a54e
  batch_size: 4
  max_length: 2304
  device: auto
  dtype: float16
  multi_gpu: true
  multi_gpu_stall_timeout_seconds: 1800
  final_top_k_documents: 5

long_context:
  enabled: true
  # `full`: score every unique mapped long chunk. For an ablation cutoff, use
  # candidate_mode: cutoff together with a positive candidate_top_k.
  candidate_mode: full
  candidate_top_k: null
  # Apply this cutoff after cross-encoder scoring and before document MaxP.
  rerank_top_k_chunks: 20
  document_aggregation: maxp
  diagnostics_store_all_candidates: true
